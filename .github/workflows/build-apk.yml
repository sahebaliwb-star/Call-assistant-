name: Build DBT LAB AI Call Assistant APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android Project
        run: |
          if [ -f "DbtLabAiCallAssistant-AndroidStudio.zip" ]; then
            unzip -o DbtLabAiCallAssistant-AndroidStudio.zip
            cp -rf DbtLabAiCallAssistant-Android/. .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dbt-lab-ai-call-assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
